<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario de tienda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <div class="container">
        <h1>Inventario de tienda</h1>
        <nav>
          <a href="{{ url_for('index') }}">Inicio</a>
          <a href="{{ url_for('productos') }}">Productos</a>
          <a href="{{ url_for('inventario') }}">Inventario</a>
          <a href="{{ url_for('movimientos') }}">Movimientos</a>
          <a href="{{ url_for('api_productos') }}">JSON</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-container">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
